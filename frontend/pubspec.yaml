name: studyverse
description: StudyVerse - Digital Ledger App for Small Businesses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.5
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Firebase
  firebase_core: ^2.15.1
  firebase_auth: ^4.7.3
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^5.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  
  # Forms & Validation
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0
  
  # Date & Time
  intl: ^0.18.1
  
  # Charts
  fl_chart: ^0.63.0
  
  # PDF Generation
  pdf: ^3.10.4
  printing: ^5.11.0
  
  # Share & Files
  share_plus: ^7.1.0
  path: ^1.8.3
  
  # Notifications
  flutter_local_notifications: ^15.1.1
  
  # Connectivity
  connectivity_plus: ^4.0.2
  
  # Utilities
  uuid: ^4.0.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^8.0.0
  
  # UPI Payment
  url_launcher: ^6.1.14
  
  # Icons
  font_awesome_flutter: ^10.6.0
  
  # Permission
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  mockito: ^5.4.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
