name: gupta_paper_stores
description: Gupta Paper Stores - Digital Ledger (Khata) App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  http: ^1.1.0
  url_launcher: ^6.2.1
  pdf: ^3.10.7
  printing: ^5.11.0
  permission_handler: ^11.1.0
  local_auth: ^2.1.7
  flutter_local_notifications: ^16.2.0
  connectivity_plus: ^5.0.2
  uuid: ^4.2.2
  crypto: ^3.0.3
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
