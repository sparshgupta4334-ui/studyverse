openapi: 3.0.3

info:
  title: KhataBook Pro API
  description: |
    REST API for **KhataBook Pro** — a free digital ledger app for small businesses.

    ## Authentication
    All endpoints except `/auth/*` require a valid JWT access token passed in the
    `Authorization` header:
    ```
    Authorization: Bearer <access_token>
    ```

    Access tokens expire in **7 days**. Use `POST /auth/refresh` with a refresh
    token to obtain a new access token without re-authenticating.

    ## Rate Limits
    | Endpoint group | Limit |
    |---|---|
    | `/auth/*` | 10 requests / 15 min per IP |
    | All other endpoints | 100 requests / min per user |

    ## Pagination
    List endpoints support cursor-based pagination via `page` and `limit` query
    parameters. Responses include a `meta` object with `total`, `page`, `limit`,
    and `totalPages` fields.

    ## Error Responses
    All errors follow the shape:
    ```json
    { "success": false, "error": { "code": "ERROR_CODE", "message": "Human-readable message" } }
    ```
  version: 1.0.0
  contact:
    name: KhataBook Pro Support
    email: support@khatabookpro.com
  license:
    name: MIT

servers:
  - url: https://api.khatabookpro.com/api/v1
    description: Production
  - url: https://staging-api.khatabookpro.com/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Phone OTP authentication & token management
  - name: Customers
    description: Customer account management
  - name: Transactions
    description: Credit and debit transaction records
  - name: Payments
    description: Razorpay payment collection
  - name: Reminders
    description: SMS / WhatsApp payment reminders
  - name: Reports
    description: Business summary reports and exports
  - name: Sync
    description: Offline-first data synchronisation

# ─────────────────────────────────────────────────────────────
# Security Schemes
# ─────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from `POST /auth/verify-otp`

  # ─────────────────────────────────────────────────────────────
  # Reusable Schemas
  # ─────────────────────────────────────────────────────────────
  schemas:

    # ── Generic wrappers ──────────────────────────────────────
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Phone number is required

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 120
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 6

    # ── Auth ─────────────────────────────────────────────────
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: integer
          description: Access token TTL in seconds
          example: 604800

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        phone:
          type: string
          example: "+919876543210"
        name:
          type: string
          example: Ravi Kumar
        businessName:
          type: string
          example: Ravi General Store
        createdAt:
          type: string
          format: date-time

    # ── Customer ─────────────────────────────────────────────
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
          example: Suresh Patel
        phone:
          type: string
          example: "+919812345678"
        email:
          type: string
          format: email
          example: suresh@example.com
        address:
          type: string
          example: 12 MG Road, Pune
        notes:
          type: string
          example: Regular customer — pays on the 1st
        balance:
          type: number
          format: double
          description: Current net balance (positive = customer owes you)
          example: 1500.00
        totalCredit:
          type: number
          format: double
          example: 5000.00
        totalDebit:
          type: number
          format: double
          example: 3500.00
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Suresh Patel
        phone:
          type: string
          pattern: '^\+?[1-9]\d{7,14}$'
          example: "+919812345678"
        email:
          type: string
          format: email
        address:
          type: string
          maxLength: 255
        notes:
          type: string
          maxLength: 500

    # ── Transaction ───────────────────────────────────────────
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        type:
          type: string
          enum: [credit, debit]
          description: credit = customer owes you; debit = you owe customer
        amount:
          type: number
          format: double
          example: 500.00
        description:
          type: string
          example: Sold 10 kg rice
        date:
          type: string
          format: date
          example: "2024-06-15"
        paymentMode:
          type: string
          enum: [cash, upi, card, bank_transfer, other]
          example: cash
        referenceId:
          type: string
          description: External payment reference (e.g., UPI transaction ID)
          example: "UPI123456789"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TransactionInput:
      type: object
      required: [customerId, type, amount, date]
      properties:
        customerId:
          type: string
          format: uuid
        type:
          type: string
          enum: [credit, debit]
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 500.00
        description:
          type: string
          maxLength: 255
          example: Sold 10 kg rice
        date:
          type: string
          format: date
          example: "2024-06-15"
        paymentMode:
          type: string
          enum: [cash, upi, card, bank_transfer, other]
          default: cash
        referenceId:
          type: string
          maxLength: 100

    # ── Payment ───────────────────────────────────────────────
    RazorpayOrder:
      type: object
      properties:
        orderId:
          type: string
          example: order_XXXXXXXXXX
        amount:
          type: integer
          description: Amount in smallest currency unit (paise)
          example: 50000
        currency:
          type: string
          example: INR
        keyId:
          type: string
          description: Razorpay public key for frontend SDK
          example: rzp_live_XXXXXXXXXX

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
        amount:
          type: number
          format: double
          example: 500.00
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        createdAt:
          type: string
          format: date-time

    # ── Reminder ─────────────────────────────────────────────
    Reminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [sms, whatsapp]
        message:
          type: string
        status:
          type: string
          enum: [sent, delivered, failed]
        sentAt:
          type: string
          format: date-time

    # ── Report ────────────────────────────────────────────────
    ReportSummary:
      type: object
      properties:
        period:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        totalCredit:
          type: number
          format: double
          example: 25000.00
        totalDebit:
          type: number
          format: double
          example: 8000.00
        netBalance:
          type: number
          format: double
          example: 17000.00
        totalCustomers:
          type: integer
          example: 45
        totalTransactions:
          type: integer
          example: 130
        topCustomers:
          type: array
          items:
            type: object
            properties:
              customerId:
                type: string
                format: uuid
              name:
                type: string
              balance:
                type: number

    # ── Sync ─────────────────────────────────────────────────
    SyncRecord:
      type: object
      properties:
        entity:
          type: string
          enum: [customer, transaction]
        operation:
          type: string
          enum: [create, update, delete]
        id:
          type: string
          format: uuid
        data:
          type: object
          description: Full entity payload (omit for delete)
        clientUpdatedAt:
          type: string
          format: date-time
          description: Timestamp from the client device

  # ─────────────────────────────────────────────────────────────
  # Reusable Parameters
  # ─────────────────────────────────────────────────────────────
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # ─────────────────────────────────────────────────────────────
  # Reusable Responses
  # ─────────────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Invalid or expired access token

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

# ─────────────────────────────────────────────────────────────
# Default security (can be overridden per-operation)
# ─────────────────────────────────────────────────────────────
security:
  - BearerAuth: []

# ─────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════════
  # AUTH
  # ══════════════════════════════════════════════
  /auth/send-otp:
    post:
      tags: [Auth]
      summary: Send OTP to phone number
      description: |
        Triggers a Firebase Phone Auth OTP to the supplied phone number.
        The client should then use the Firebase SDK to handle the verification
        flow and pass the resulting ID token to `POST /auth/verify-otp`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{7,14}$'
                  example: "+919876543210"
            example:
              phone: "+919876543210"
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessionInfo:
                            type: string
                            description: Firebase session info token (pass to verify-otp)
              example:
                success: true
                message: OTP sent successfully
                data:
                  sessionInfo: "AJOnW4Rg..."
        "422":
          $ref: '#/components/responses/ValidationError'
        "429":
          $ref: '#/components/responses/TooManyRequests'

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP and issue JWT tokens
      description: |
        Verifies the Firebase ID token obtained after successful OTP verification
        on the client. Creates a new user account if this is the first login.
        Returns an access + refresh token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firebaseIdToken]
              properties:
                firebaseIdToken:
                  type: string
                  description: Firebase ID token from client-side verification
                  example: "eyJhbGciOiJSUzI1NiIsImtpZCI6..."
                name:
                  type: string
                  description: Display name (used only on first registration)
                  example: Ravi Kumar
                businessName:
                  type: string
                  description: Business name (used only on first registration)
                  example: Ravi General Store
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      tokens:
                        $ref: '#/components/schemas/TokenPair'
                      user:
                        $ref: '#/components/schemas/UserProfile'
                      isNewUser:
                        type: boolean
                        example: false
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access + refresh token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TokenPair'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ══════════════════════════════════════════════
  # CUSTOMERS
  # ══════════════════════════════════════════════
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      description: Returns paginated list of all customers belonging to the authenticated user.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          description: Filter by name or phone (partial match)
          schema:
            type: string
            example: Suresh
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, balance, createdAt]
            default: createdAt
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: Suresh Patel
              phone: "+919812345678"
              address: 12 MG Road, Pune
              notes: Regular customer
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Customer'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationError'

  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'

    get:
      tags: [Customers]
      summary: Get customer by ID
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Customer'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Customers]
      summary: Update customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Customer'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Customers]
      summary: Delete customer
      description: Soft-deletes the customer. Associated transactions are preserved.
      responses:
        "200":
          description: Customer deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  # ══════════════════════════════════════════════
  # TRANSACTIONS
  # ══════════════════════════════════════════════
  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by customer
        - name: type
          in: query
          schema:
            type: string
            enum: [credit, debit]
        - name: from
          in: query
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: to
          in: query
          schema:
            type: string
            format: date
            example: "2024-06-30"
        - name: paymentMode
          in: query
          schema:
            type: string
            enum: [cash, upi, card, bank_transfer, other]
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Transactions]
      summary: Record new transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
            example:
              customerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: credit
              amount: 500.00
              description: Sold 10 kg rice
              date: "2024-06-15"
              paymentMode: cash
      responses:
        "201":
          description: Transaction recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Transaction'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationError'

  /transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'

    get:
      tags: [Transactions]
      summary: Get transaction by ID
      responses:
        "200":
          description: Transaction details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Transaction'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Transactions]
      summary: Update transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        "200":
          description: Transaction updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Transaction'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Transactions]
      summary: Delete transaction
      description: Permanently deletes the transaction and reverses the customer balance.
      responses:
        "200":
          description: Transaction deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  # ══════════════════════════════════════════════
  # PAYMENTS
  # ══════════════════════════════════════════════
  /payments/create-order:
    post:
      tags: [Payments]
      summary: Create Razorpay payment order
      description: |
        Creates a Razorpay order for the given amount. Pass the returned `orderId`
        and `keyId` to the Razorpay Flutter/JS SDK to open the payment sheet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, amount]
              properties:
                customerId:
                  type: string
                  format: uuid
                amount:
                  type: number
                  format: double
                  minimum: 1.00
                  example: 500.00
                description:
                  type: string
                  example: Payment for June invoice
            example:
              customerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              amount: 500.00
              description: Payment for June invoice
      responses:
        "201":
          description: Razorpay order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/RazorpayOrder'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationError'

  /payments/verify:
    post:
      tags: [Payments]
      summary: Verify Razorpay payment signature
      description: |
        Verifies the HMAC-SHA256 signature returned by Razorpay after payment
        completion. On success, records a transaction and updates the customer balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpayOrderId, razorpayPaymentId, razorpaySignature]
              properties:
                razorpayOrderId:
                  type: string
                  example: order_XXXXXXXXXX
                razorpayPaymentId:
                  type: string
                  example: pay_XXXXXXXXXX
                razorpaySignature:
                  type: string
                  example: "9ef4dffbfd84f1318f6739a3ce19f9d85851857ae648f114332d8401e0949a3d"
      responses:
        "200":
          description: Payment verified and recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Payment'
        "400":
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /payments:
    get:
      tags: [Payments]
      summary: List payment history
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed, failed, refunded]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Payment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ══════════════════════════════════════════════
  # REMINDERS
  # ══════════════════════════════════════════════
  /reminders/send:
    post:
      tags: [Reminders]
      summary: Send payment reminder
      description: Sends an SMS or WhatsApp payment reminder to one or more customers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerIds, channel]
              properties:
                customerIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 50
                channel:
                  type: string
                  enum: [sms, whatsapp]
                  example: sms
                message:
                  type: string
                  description: Custom message body (uses default template if omitted)
                  maxLength: 320
                  example: "Dear {name}, you have an outstanding balance of ₹{balance}. Please pay at your earliest convenience."
            example:
              customerIds:
                - 3fa85f64-5717-4562-b3fc-2c963f66afa6
              channel: sms
      responses:
        "200":
          description: Reminders dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sent:
                        type: integer
                        example: 3
                      failed:
                        type: integer
                        example: 0
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Reminder'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationError'

  /reminders:
    get:
      tags: [Reminders]
      summary: List sent reminders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: channel
          in: query
          schema:
            type: string
            enum: [sms, whatsapp]
        - name: status
          in: query
          schema:
            type: string
            enum: [sent, delivered, failed]
      responses:
        "200":
          description: Reminder list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reminder'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ══════════════════════════════════════════════
  # REPORTS
  # ══════════════════════════════════════════════
  /reports/summary:
    get:
      tags: [Reports]
      summary: Business summary report
      description: |
        Returns aggregated financial summary for the authenticated user.
        Defaults to the current calendar month if `from`/`to` are omitted.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: to
          in: query
          schema:
            type: string
            format: date
            example: "2024-06-30"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: month
      responses:
        "200":
          description: Summary report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReportSummary'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /reports/export:
    get:
      tags: [Reports]
      summary: Export report as PDF or Excel
      description: Generates and returns a downloadable report file.
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [pdf, xlsx]
          example: pdf
        - name: from
          in: query
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: to
          in: query
          schema:
            type: string
            format: date
            example: "2024-06-30"
        - name: customerId
          in: query
          description: Scope report to a single customer
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationError'

  # ══════════════════════════════════════════════
  # SYNC
  # ══════════════════════════════════════════════
  /sync/push:
    post:
      tags: [Sync]
      summary: Push offline changes to the cloud
      description: |
        Accepts a batch of create/update/delete operations recorded on the
        client while offline. The server applies them in order and returns
        per-record results including any conflict details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                deviceId:
                  type: string
                  description: Stable device identifier for conflict resolution
                  example: "device_abc123"
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/SyncRecord'
                  minItems: 1
                  maxItems: 500
            example:
              deviceId: device_abc123
              records:
                - entity: transaction
                  operation: create
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  data:
                    customerId: a1b2c3d4-1234-5678-abcd-ef0123456789
                    type: credit
                    amount: 250.00
                    date: "2024-06-20"
                    paymentMode: cash
                  clientUpdatedAt: "2024-06-20T14:32:00Z"
      responses:
        "200":
          description: Sync results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      applied:
                        type: integer
                        example: 5
                      skipped:
                        type: integer
                        example: 0
                      conflicts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            reason:
                              type: string
                              example: Conflict — server version is newer
                            serverRecord:
                              type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationError'

  /sync/pull:
    get:
      tags: [Sync]
      summary: Pull latest changes to device
      description: |
        Returns all records (customers + transactions) that have been created or
        updated server-side since `lastSyncAt`. Pass the `serverTime` from the
        previous pull response as `lastSyncAt` in the next request.
      parameters:
        - name: lastSyncAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: "2024-06-01T00:00:00Z"
          description: ISO-8601 timestamp of last successful sync
        - name: deviceId
          in: query
          schema:
            type: string
            example: device_abc123
      responses:
        "200":
          description: Changes since lastSyncAt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      customers:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
                      transactions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
                      deletedIds:
                        type: array
                        description: UUIDs of records deleted since lastSyncAt
                        items:
                          type: string
                          format: uuid
                      serverTime:
                        type: string
                        format: date-time
                        description: Server timestamp to use as lastSyncAt on next pull
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationError'
